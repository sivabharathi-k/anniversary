<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Our Little Forever — Private Anniversary Website">
    <title>Our Little Forever 🩵✨</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Dancing+Script:wght@500;600;700&family=Caveat:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/audio.css">
</head>
<body>

    <!-- Background particle layer -->
    <div class="bg-particles" aria-hidden="true" id="bgParticles"></div>

    <!-- Background texture overlay -->
    <div class="bg-texture" aria-hidden="true"></div>

    <!-- ===== LOGIN WRAPPER ===== -->
    <main class="login-page">

        <div class="login-card" id="loginCard" role="main">

            <!-- Top ornament -->
            <div class="card-ornament" aria-hidden="true">
                <svg viewBox="0 0 120 24" xmlns="http://www.w3.org/2000/svg">
                    <line x1="0" y1="12" x2="45" y2="12" stroke="#c4a08a" stroke-width="0.8" opacity="0.5"/>
                    <path d="M57 12 C56 10, 50 6, 50 3 C50 0, 52 -1, 54 1 C55 2, 56 3, 57 4 C58 3, 59 2, 60 1 C62 -1, 64 0, 64 3 C64 6, 58 10, 57 12 Z" fill="#c4a08a" opacity="0.55"/>
                    <line x1="69" y1="12" x2="120" y2="12" stroke="#c4a08a" stroke-width="0.8" opacity="0.5"/>
                    <circle cx="10" cy="12" r="1.5" fill="#c4a08a" opacity="0.35"/>
                    <circle cx="110" cy="12" r="1.5" fill="#c4a08a" opacity="0.35"/>
                </svg>
            </div>

            <!-- Heading -->
            <h1 class="login-title">Our Little Forever 🩵✨</h1>
            <p class="login-subtitle">Some memories are meant for us alone.</p>

            <!-- Form -->
            <form class="login-form" id="loginForm" novalidate autocomplete="off">

                <!-- Name -->
                <div class="input-group">
                    <label for="loginName" class="input-label">Name</label>
                    <div class="input-wrap">
                        <input
                            type="text"
                            id="loginName"
                            name="loginName"
                            class="login-input"
                            placeholder="Enter Name"
                            autocomplete="off"
                            spellcheck="false"
                        >
                    </div>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label for="loginPassword" class="input-label">Password</label>
                    <div class="input-wrap">
                        <input
                            type="password"
                            id="loginPassword"
                            name="loginPassword"
                            class="login-input"
                            placeholder="Enter Password"
                            autocomplete="new-password"
                        >
                    </div>
                </div>

                <!-- Anniversary -->
                <div class="input-group">
                    <label for="loginAnniversary" class="input-label">What Special Day</label>
                    <div class="input-wrap">
                        <input
                            type="text"
                            id="loginAnniversary"
                            name="loginAnniversary"
                            class="login-input"
                            placeholder="Enter today's special day"
                            autocomplete="off"
                            spellcheck="false"
                        >
                    </div>
                </div>

                <!-- Hint link — navigates to secret.html without login -->
                <div class="hint-link-wrap">
                    <a href="secret.html" class="hint-link" id="hintLink">
                        Login panna key inga iruku chellam 🩵
                    </a>
                </div>

                <!-- Error message -->
                <p class="error-msg" id="errorMsg" aria-live="polite" role="alert">
                    Oops... that&#8217;s not our little secret 🩵
                </p>

                <!-- Submit -->
                <button type="submit" class="login-btn" id="loginBtn">
                    Enter Our Story ✨
                </button>

            </form>

            <!-- Bottom ornament -->
            <div class="card-ornament bottom" aria-hidden="true">
                <svg viewBox="0 0 80 16" xmlns="http://www.w3.org/2000/svg">
                    <text x="28" y="12" font-size="8" fill="#c4a08a" opacity="0.45" font-family="serif">&#10022; &#10022; &#10022;</text>
                </svg>
            </div>

        </div>

    </main>

    <script src="js/login.js"></script>
    <script src="js/audio.js"></script>
</body>
</html>

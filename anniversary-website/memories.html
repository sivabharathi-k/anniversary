<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Our Memories — Two years of beautiful moments together.">
    <title>Our Memories ✨</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Caveat:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/memories.css">
</head>
<body>

    <!-- Dark scrapbook background texture -->
    <div class="scrapbook-bg" aria-hidden="true"></div>

    <!-- ===== PAGE WRAPPER ===== -->
    <main class="scrapbook-page">

        <!-- Back navigation -->
        <nav class="back-nav" aria-label="Back to anniversary letter">
            <a href="index.html" class="back-link">
                <span class="back-arrow" aria-hidden="true">&#8592;</span>
                Back to Our Letter
            </a>
        </nav>

        <!-- Page title -->
        <header class="scrapbook-header">
            <h1 class="scrapbook-title">Our Memories</h1>
            <p class="scrapbook-subtitle">Two Years of Us</p>
        </header>

        <!-- ===== SCRAPBOOK CANVAS ===== -->
        <div class="scrapbook-canvas" role="region" aria-label="Scrapbook photo collage">

            <!-- Torn paper background pieces -->
            <div class="torn-paper torn-1" aria-hidden="true"></div>
            <div class="torn-paper torn-2" aria-hidden="true"></div>
            <div class="torn-paper torn-3" aria-hidden="true"></div>
            <div class="torn-paper torn-4" aria-hidden="true"></div>

            <!-- SVG Decorations -->
            <div class="decoration deco-hearts-1" aria-hidden="true">
                <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 28 C14 26, 4 20, 4 13 C4 7, 9 3, 13 3 C15 3, 17 5, 19 7 C21 5, 23 3, 26 3 C30 3, 34 7, 34 13 C34 20, 24 26, 22 28 C20 30, 16 30, 15 28 Z" fill="none" stroke="#c4956a" stroke-width="1.5" opacity="0.7"/>
                    <path d="M40 52 C39 50, 32 46, 32 41 C32 37, 36 34, 38 34 C39.5 34, 41 35.5, 42 37 C43 35.5, 44.5 34, 46 34 C48 34, 52 37, 52 41 C52 46, 45 50, 44 52 C43 54, 40.5 54, 40 52 Z" fill="#c4956a" opacity="0.35"/>
                </svg>
            </div>

            <div class="decoration deco-stars" aria-hidden="true">
                <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
                    <text x="5"  y="20" font-size="12" fill="#d4a96a" opacity="0.6" font-family="serif">&#10022;</text>
                    <text x="50" y="35" font-size="8"  fill="#d4a96a" opacity="0.5" font-family="serif">&#10022;</text>
                    <text x="25" y="60" font-size="10" fill="#d4a96a" opacity="0.55" font-family="serif">&#10022;</text>
                    <text x="65" y="70" font-size="6"  fill="#d4a96a" opacity="0.4" font-family="serif">&#10022;</text>
                </svg>
            </div>

            <div class="decoration deco-stars-2" aria-hidden="true">
                <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                    <text x="10" y="20" font-size="9"  fill="#c4956a" opacity="0.5" font-family="serif">&#10022;</text>
                    <text x="40" y="45" font-size="7"  fill="#c4956a" opacity="0.45" font-family="serif">&#10022;</text>
                    <text x="5"  y="55" font-size="11" fill="#c4956a" opacity="0.35" font-family="serif">&#10022;</text>
                </svg>
            </div>

            <!-- Dried flower decorations (SVG) -->
            <div class="decoration deco-flower-1" aria-hidden="true">
                <svg viewBox="0 0 80 120" xmlns="http://www.w3.org/2000/svg">
                    <line x1="40" y1="115" x2="40" y2="40" stroke="#6b4c2a" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M40 85 Q55 75 58 60 Q45 68 40 85 Z" fill="#7a6040" opacity="0.65"/>
                    <path d="M40 70 Q25 60 22 45 Q35 53 40 70 Z" fill="#7a6040" opacity="0.55"/>
                    <ellipse cx="40" cy="30" rx="6"  ry="14" fill="#c4895a" opacity="0.7"  transform="rotate(0 40 30)"/>
                    <ellipse cx="40" cy="30" rx="6"  ry="14" fill="#b87a50" opacity="0.6"  transform="rotate(45 40 30)"/>
                    <ellipse cx="40" cy="30" rx="6"  ry="14" fill="#c4895a" opacity="0.65" transform="rotate(90 40 30)"/>
                    <ellipse cx="40" cy="30" rx="6"  ry="14" fill="#b87a50" opacity="0.55" transform="rotate(135 40 30)"/>
                    <circle cx="40" cy="30" r="5" fill="#8b5e3c" opacity="0.8"/>
                    <circle cx="40" cy="30" r="3" fill="#6b3e20" opacity="0.6"/>
                </svg>
            </div>

            <div class="decoration deco-flower-2" aria-hidden="true">
                <svg viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg">
                    <line x1="30" y1="85" x2="30" y2="35" stroke="#6b4c2a" stroke-width="1.2" stroke-linecap="round"/>
                    <path d="M30 65 Q42 58 44 46 Q33 52 30 65 Z" fill="#7a6040" opacity="0.6"/>
                    <ellipse cx="30" cy="25" rx="5"  ry="12" fill="#d4956a" opacity="0.65" transform="rotate(20 30 25)"/>
                    <ellipse cx="30" cy="25" rx="5"  ry="12" fill="#c4855a" opacity="0.6"  transform="rotate(80 30 25)"/>
                    <ellipse cx="30" cy="25" rx="5"  ry="12" fill="#d4956a" opacity="0.55" transform="rotate(140 30 25)"/>
                    <circle cx="30" cy="25" r="4" fill="#7a4e2d" opacity="0.75"/>
                </svg>
            </div>

            <div class="decoration deco-flower-3" aria-hidden="true">
                <svg viewBox="0 0 50 75" xmlns="http://www.w3.org/2000/svg">
                    <line x1="25" y1="70" x2="25" y2="30" stroke="#5a3c1a" stroke-width="1" stroke-linecap="round"/>
                    <ellipse cx="25" cy="20" rx="4" ry="10" fill="#b87060" opacity="0.7"  transform="rotate(0 25 20)"/>
                    <ellipse cx="25" cy="20" rx="4" ry="10" fill="#a06050" opacity="0.65" transform="rotate(60 25 20)"/>
                    <ellipse cx="25" cy="20" rx="4" ry="10" fill="#b87060" opacity="0.6"  transform="rotate(120 25 20)"/>
                    <circle cx="25" cy="20" r="3.5" fill="#6b3e20" opacity="0.8"/>
                </svg>
            </div>

            <!-- Handwritten notes -->
            <div class="scrap-note note-1" aria-label="Decorative note: good things take time">
                <p>good things<br>take time &#9825;</p>
            </div>

            <div class="scrap-note note-2" aria-label="Decorative note: always you">
                <p>always<br>you &#9825;</p>
            </div>

            <div class="scrap-note note-3" aria-label="Decorative note: forever and always">
                <p>forever<br>&amp; always</p>
            </div>

            <!-- ===== POLAROID FRAMES ===== -->

            <div class="polaroid polaroid-1" data-index="0">
                <div class="tape" aria-hidden="true"></div>
                <div class="photo-container">
                    <img class="polaroid-img" src="assets/images/image11.jpeg" alt="Our first anniversary memory" loading="lazy">
                </div>
                <div class="polaroid-caption">Our Story Begins</div>
            </div>

            <div class="polaroid polaroid-2" data-index="1">
                <div class="tape tape-diagonal" aria-hidden="true"></div>
                <div class="photo-container">
                    <img class="polaroid-img" src="assets/images/image22.jpeg" alt="A beautiful memory together" loading="lazy">
                </div>
                <div class="polaroid-caption">Beautiful Day</div>
            </div>

            <div class="polaroid polaroid-3 polaroid-center" data-index="2">
                <div class="tape tape-center" aria-hidden="true"></div>
                <div class="photo-container">
                    <img class="polaroid-img" src="assets/images/image33.jpeg" alt="Our beautiful journey together" loading="lazy">
                </div>
                <div class="polaroid-caption">Our Beautiful Journey</div>
            </div>

            <div class="polaroid polaroid-4" data-index="3">
                <div class="tape" aria-hidden="true"></div>
                <div class="photo-container">
                    <img class="polaroid-img" src="assets/images/image44.jpeg" alt="A cherished memory" loading="lazy">
                </div>
                <div class="polaroid-caption">Cherished Moment</div>
            </div>

            <div class="polaroid polaroid-5" data-index="4">
                <div class="tape tape-diagonal" aria-hidden="true"></div>
                <div class="photo-container">
                    <img class="polaroid-img" src="assets/images/image55.jpeg" alt="Together always" loading="lazy">
                </div>
                <div class="polaroid-caption">Together Always</div>
            </div>

            <div class="polaroid polaroid-6" data-index="5">
                <div class="tape" aria-hidden="true"></div>
                <div class="photo-container">
                    <img class="polaroid-img" src="assets/images/image66.jpeg" alt="A memory I hold dear" loading="lazy">
                </div>
                <div class="polaroid-caption">My Favourite Memory</div>
            </div>

        </div>
        <!-- /scrapbook-canvas -->

        <!-- Gift navigation link -->
        <div class="gift-link-section">
            <div class="gift-divider" aria-hidden="true">
                <span class="gift-divider-line"></span>
                <span class="gift-divider-ornament">&#10022;</span>
                <span class="gift-divider-line"></span>
            </div>
            <a href="music.html" class="gift-link" aria-label="Open my small memorable gift for you">
                My Small Memorable Gift 🩵
            </a>
            <p class="gift-link-hint">something special, just for you &hellip;</p>
        </div>

        <!-- Bottom flourish -->
        <div class="scrapbook-footer" aria-hidden="true">
            <span class="footer-text">made with love &#9825;</span>
        </div>

    </main>

    <script src="js/memories.js"></script>
</body>
</html>

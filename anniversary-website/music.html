        <div class="bg-hearts" aria-hidden="true">

                <path d="M80 200 C79 198, 73 194, 73 189 C73 185, 77 182, 79 184 C80 185, 81 186, 82 184 C84 182, 87 185, 87 189 C87 194, 81 198, 80 200 Z" fill="#c4988a" opacity="0.22"/>

    <!-- ===== MAIN CARD ===== -->
    <main class="music-gift-page">

        <!-- Back link -->
        <nav class="back-nav" aria-label="Back to memories">
            <a href="memories.html" class="back-link">
                <span class="back-arrow" aria-hidden="true">&#8592;</span>
                Back to Our Memories
            </a>
        </nav>

        <section class="gift-card" role="main">

            <!-- Top bow — overlaps card edge -->
            <div class="top-bow" aria-hidden="true">
                <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
                    <!-- Left wing top -->
                    <path d="M60 42 C48 28, 14 18, 10 32 C7 44, 36 46, 60 42 Z" fill="#d4a898"/>
                    <!-- Right wing top -->
                    <path d="M60 42 C72 28, 106 18, 110 32 C113 44, 84 46, 60 42 Z" fill="#c89080"/>
                    <!-- Left wing bottom -->
                    <path d="M60 42 C48 56, 14 66, 10 52 C7 40, 36 38, 60 42 Z" fill="#c89080"/>
                    <!-- Right wing bottom -->
                    <path d="M60 42 C72 56, 106 66, 110 52 C113 40, 84 38, 60 42 Z" fill="#d4a898"/>
                    <!-- Tail left -->
                    <path d="M60 42 C54 50, 48 60, 44 72" stroke="#c89080" stroke-width="3.5" stroke-linecap="round" fill="none"/>
                    <!-- Tail right -->
                    <path d="M60 42 C66 50, 72 60, 76 72" stroke="#d4a898" stroke-width="3.5" stroke-linecap="round" fill="none"/>
                    <!-- Centre knot -->
                    <ellipse cx="60" cy="42" rx="7" ry="5.5" fill="#bf8070"/>
                    <ellipse cx="60" cy="42" rx="4" ry="3" fill="#a86858"/>
                    <!-- Sparkles -->
                    <text x="18" y="26" font-size="8" fill="#d4a898" opacity="0.8" font-family="serif">✦</text>
                    <text x="94" y="24" font-size="6" fill="#c89080" opacity="0.7" font-family="serif">✦</text>
                </svg>
            </div>

            <!-- Card header -->
            <div class="gift-header">
                <span class="deco-sparkle" aria-hidden="true">✦</span>
                <h1 class="gift-title">a little gift for you</h1>
                <!-- Heart outline -->
                <div class="header-heart" aria-hidden="true">
                    <svg viewBox="0 0 28 26" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14 22 C13 21, 2 14, 2 8 C2 4, 5 1, 8 1 C10 1, 12 3, 14 5 C16 3, 18 1, 20 1 C23 1, 26 4, 26 8 C26 14, 15 21, 14 22 Z" fill="none" stroke="#c4888a" stroke-width="1.8"/>
                    </svg>
                </div>
            </div>

            <!-- ── PHOTO FRAME → opens Spotify ── -->
            <a
                class="gift-photo-link"
                href="https://open.spotify.com/playlist/04j6ra71ZCarEwNsQAH4AL?si=KrU866RjQZaGs2AW8ZxgbQ&utm_source=whatsapp&pt=c07e898e58f65b0a6c9517ff66993c5d"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Open our collaborative Spotify playlist"
            >
                <div class="gift-photo-frame">
                    <div class="lace-border">
                        <img
                            src="assets/images/image77.jpeg"
                            alt="Our special anniversary memory"
                            class="gift-photo-img"
                        >
                    </div>
                </div>
            </a>

            <!-- Music info row -->
            <div class="music-info">
                <div class="music-text">
                    <h2 class="song-title">darling, you&#8217;re so sweet</h2>
                    <p class="song-artist">hearts &amp; kisses</p>
                </div>
                <div class="music-heart" aria-hidden="true">
                    <svg viewBox="0 0 22 20" xmlns="http://www.w3.org/2000/svg">
                        <path d="M11 17 C10 16, 1 10, 1 5.5 C1 2.5, 3.5 0.5, 6 0.5 C8 0.5, 10 2, 11 3.5 C12 2, 14 0.5, 16 0.5 C18.5 0.5, 21 2.5, 21 5.5 C21 10, 12 16, 11 17 Z" fill="#c4888a"/>
                    </svg>
                </div>
            </div>

            <!-- Progress bar -->
            <div class="progress-section" aria-label="Song progress">
                <div class="progress-track">
                    <div class="progress-fill"></div>
                    <div class="progress-dot"></div>
                </div>
                <div class="progress-times">
                    <span>0:56</span>
                    <span>-2:45</span>
                </div>
            </div>

            <!-- Music controls -->
            <div class="music-controls" role="group" aria-label="Music controls">

                <!-- Shuffle -->
                <button class="ctrl-btn ctrl-small" aria-label="Shuffle" type="button">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="16 3 21 3 21 8"/>
                        <line x1="4" y1="20" x2="21" y2="3"/>
                        <polyline points="21 16 21 21 16 21"/>
                        <line x1="15" y1="15" x2="21" y2="21"/>
                    </svg>
                </button>

                <!-- Previous -->
                <button class="ctrl-btn ctrl-small" aria-label="Previous track" type="button">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                        <polygon points="19 20 9 12 19 4 19 20"/>
                        <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                    </svg>
                </button>

                <!-- Play / Pause — large centre button -->
                <button class="ctrl-btn ctrl-play" id="playBtn" aria-label="Play / Pause" type="button">
                    <svg class="icon-play" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    <svg class="icon-pause" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor" style="display:none">
                        <rect x="6" y="4" width="4" height="16" rx="1"/>
                        <rect x="14" y="4" width="4" height="16" rx="1"/>
                    </svg>
                </button>

                <!-- Next -->
                <button class="ctrl-btn ctrl-small" aria-label="Next track" type="button">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                        <polygon points="5 4 15 12 5 20 5 4"/>
                        <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                    </svg>
                </button>

                <!-- Repeat -->
                <button class="ctrl-btn ctrl-small" aria-label="Repeat" type="button">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="17 1 21 5 17 9"/>
                        <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                        <polyline points="7 23 3 19 7 15"/>
                        <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                    </svg>
                </button>

            </div>

            <!-- Spotify invitation message -->
            <p class="spotify-invitation">
                Let&#8217;s make a playlist together, join and edit 🩵🕊️
            </p>

            <!-- Bottom: Spotify icon + waveform -->
            <div class="spotify-bar">
                <div class="spotify-icon" aria-hidden="true">
                    <!-- Spotify logo mark -->
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="11" fill="#c4888a" opacity="0.9"/>
                        <path d="M17 16.5 C14 15, 9 14.8, 6.5 16 C6 16.2, 5.7 15.8, 6 15.5 C8.8 14.2, 14.2 14, 17.5 15.8 C17.8 16, 17.5 16.7, 17 16.5 Z" fill="#f5ece8"/>
                        <path d="M18 13.8 C14.5 12, 9 11.8, 6 13.2 C5.4 13.5, 5 13, 5.4 12.6 C8.8 11, 14.8 10.8, 18.6 12.8 C19.1 13.1, 18.5 14, 18 13.8 Z" fill="#f5ece8"/>
                        <path d="M18.8 11 C14.5 9, 8.5 8.5, 5.5 10 C4.8 10.4, 4.3 9.8, 4.8 9.4 C8.2 7.7, 14.8 7.8, 19.5 10 C20.1 10.3, 19.4 11.3, 18.8 11 Z" fill="#f5ece8"/>
                    </svg>
                </div>

                <!-- CSS waveform bars -->
                <div class="waveform" aria-hidden="true">
                    <span style="--h:35%"></span>
                    <span style="--h:60%"></span>
                    <span style="--h:45%"></span>
                    <span style="--h:80%"></span>
                    <span style="--h:55%"></span>
                    <span style="--h:90%"></span>
                    <span style="--h:65%"></span>
                    <span style="--h:75%"></span>
                    <span style="--h:50%"></span>
                    <span style="--h:85%"></span>
                    <span style="--h:40%"></span>
                    <span style="--h:70%"></span>
                    <span style="--h:95%"></span>
                    <span style="--h:60%"></span>
                    <span style="--h:45%"></span>
                    <span style="--h:80%"></span>
                    <span style="--h:55%"></span>
                    <span style="--h:70%"></span>
                    <span style="--h:40%"></span>
                    <span style="--h:65%"></span>
                    <span style="--h:85%"></span>
                    <span style="--h:50%"></span>
                    <span style="--h:75%"></span>
                    <span style="--h:35%"></span>
                    <span style="--h:60%"></span>
                    <span style="--h:45%"></span>
                    <span style="--h:55%"></span>
                </div>
            </div>

        </section>

    </main>

    <script src="js/music.js"></script>
